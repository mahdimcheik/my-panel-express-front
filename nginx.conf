# Front container: serves the SPA and forwards API paths to the ASP.NET container.
# This is the PROD equivalent of proxy.conf.js (which is dev/ng-serve only).

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Allow reasonably large uploads to /media (adjust to your needs).
    client_max_body_size 25m;

    # --- API: same path list as proxy.conf.js -> the existing BonProf API container ---
    # "container-api-mypanelexpress" is BonProf's container_name on global-network; the port must match
    # its ASPNETCORE_URLS / exposed port (7113 in BonProf's docker-compose.yml).
    location ~ ^/(auth|contact|horaires|media|realisations|services) {
        proxy_pass         http://container-api-mypanelexpress:7113;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # keep upstream connections alive
        proxy_set_header   Connection        "";
    }

    # --- Static assets: long cache for hashed files (main-<hash>.js, styles-<hash>.css, fonts) ---
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # --- SPA fallback: deep-links / refresh (/services, /realisations, ...) serve index.html ---
    # Prod equivalent of the `bypass` in proxy.conf.js.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml font/woff2;
}
