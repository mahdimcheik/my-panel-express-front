server {
    listen 80;
    server_name _;

    # 1. Ajout du résolveur DNS interne de Docker (indispensable après une coupure)
    resolver 127.0.0.11 valid=10s;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    location ~ ^/(auth|contact|horaires|media|realisations|services|parametres) {
        # 2. On stocke l'URL dans une variable pour forcer l'évaluation DNS dynamique
        set $api_upstream http://container-api-mypanelexpress:80;
        
        # 3. Nginx utilisera le resolver pour trouver la nouvelle IP à chaque fois
        proxy_pass         $api_upstream;
        
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml font/woff2;
}