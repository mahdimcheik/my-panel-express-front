services:
  # Angular SPA served by nginx; also reverse-proxies API paths to the existing
  # BonProf API container (container-api) over the shared global-network.
  web:
    build: .
    image: mahdimcheik/my-panel-express:latest
    container_name: container-mpe-web
    restart: always
    networks:
      - global-network   # shared with Nginx Proxy Manager AND the BonProf api
    # No `ports:` — public traffic comes only through Nginx Proxy Manager.

networks:
  # Shared network where Nginx Proxy Manager and the BonProf stack already live.
  global-network:
    external: true
